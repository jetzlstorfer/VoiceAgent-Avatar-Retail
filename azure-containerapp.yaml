apiVersion: apps/v1beta2
kind: ContainerApp
metadata:
  name: voice-live-avatar-app
spec:
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 8000
      allowInsecure: false
      traffic:
        - weight: 100
          latestRevision: true
    secrets:
      - name: azure-openai-key
        value: "" # Set via Azure CLI or Portal
      - name: speech-key
        value: "" # Optional; required when AZURE_VOICE_SOURCE=avatar
  template:
    containers:
      - name: voice-live-avatar
        image: <your-registry>.azurecr.io/voice-live-avatar:latest
        resources:
          cpu: 1.0
          memory: 2Gi
        env:
          - name: AZURE_VOICE_LIVE_ENDPOINT
            value: "https://<your-voice-live-resource>.cognitiveservices.azure.com/"
          - name: VOICE_LIVE_MODEL
            value: "gpt-realtime"
          - name: AZURE_OPENAI_API_KEY
            secretRef: azure-openai-key
          - name: AZURE_SPEECH_KEY
            secretRef: speech-key
          - name: AZURE_VOICE_SOURCE
            value: "auto"
          - name: AZURE_VOICE_AVATAR_CHARACTER
            value: "lisa"
          - name: AZURE_VOICE_AVATAR_STYLE
            value: "casual-sitting"
          - name: AZURE_AGENT_ENDPOINT
            value: "https://<resource>.services.ai.azure.com/api/projects/<project>/applications/<agent>/protocols/openai/responses?api-version=2025-11-15-preview"
          - name: LOGIC_APP_URL_SHIPMENT_ORDERS
            value: "https://<your-logic-app-shipment-url>"
          - name: LOGIC_APP_URL_CALL_LOG_ANALYSIS
            value: "https://<your-logic-app-call-analysis-url>"
          - name: ECOM_API_URL
            value: "https://<optional-ecom-api-host>"
        probes:
          - type: Liveness
            httpGet:
              path: "/health/live"
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          - type: Readiness
            httpGet:
              path: "/health/ready" 
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
    scale:
      minReplicas: 1
      maxReplicas: 10
      rules:
        - name: http-scaler
          http:
            metadata:
              concurrentRequests: "10"